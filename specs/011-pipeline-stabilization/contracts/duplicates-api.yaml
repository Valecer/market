openapi: 3.0.3
info:
  title: Duplicate Management API
  description: |
    API for managing potential duplicate products detected by the auto-creation pipeline.
    Provides endpoints for listing, merging, and dismissing suspected duplicates.
  version: 1.0.0
  contact:
    name: Marketbel Dev Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://staging.marketbel.com/api/v1
    description: Staging environment
  - url: https://api.marketbel.com/api/v1
    description: Production

tags:
  - name: Duplicates
    description: Potential duplicate product management

paths:
  /admin/duplicates:
    get:
      summary: List potential duplicates
      description: |
        Retrieve a paginated list of potential duplicate product pairs.
        Filterable by status (pending, merged, dismissed).
      operationId: listDuplicates
      tags:
        - Duplicates
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by duplicate status
          required: false
          schema:
            type: string
            enum: [pending, merged, dismissed]
            default: pending
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of results to skip (for pagination)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of potential duplicates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/duplicates/{id}/merge:
    patch:
      summary: Merge duplicate products
      description: |
        Merge two duplicate products by reassigning all supplier_items from the
        archived product to the kept product. The archived product is marked as
        'archived' status and the duplicate record is marked as 'merged'.
      operationId: mergeDuplicates
      tags:
        - Duplicates
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Potential duplicate record ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeDuplicateRequest'
      responses:
        '200':
          description: Merge successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeDuplicateResponse'
        '400':
          description: Invalid request (e.g., keepProductId not in duplicate pair)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Duplicate record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/duplicates/{id}/dismiss:
    patch:
      summary: Dismiss duplicate flag
      description: |
        Mark a potential duplicate pair as 'dismissed' (false positive).
        The products remain separate and active.
      operationId: dismissDuplicate
      tags:
        - Duplicates
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Potential duplicate record ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dismiss successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Duplicate record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication endpoint

  schemas:
    ProductSummary:
      type: object
      required:
        - id
        - name
        - category
        - price
        - supplierCount
      properties:
        id:
          type: string
          format: uuid
          description: Product ID
          example: "a3f2b91c-4d5e-6f7a-8b9c-0d1e2f3a4b5c"
        name:
          type: string
          description: Product name
          example: "Battery 48V 20Ah Shtenli"
        category:
          type: string
          description: Full category path (Level 1 > Level 2 > Level 3)
          example: "Electric Transport > Motorcycles > Shtenli"
        price:
          type: number
          format: double
          description: Current retail price
          example: 15000.50
        supplierCount:
          type: integer
          description: Number of supplier_items linked to this product
          example: 3

    PotentialDuplicate:
      type: object
      required:
        - id
        - product1
        - product2
        - similarityScore
        - detectionReason
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Duplicate record ID
          example: "b4e3c82d-5f6a-7e8b-9c0d-1e2f3a4b5c6d"
        product1:
          $ref: '#/components/schemas/ProductSummary'
        product2:
          $ref: '#/components/schemas/ProductSummary'
        similarityScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Name similarity score (0-100)
          example: 87.5
        detectionReason:
          type: string
          enum: [auto_creation_similarity, manual_report]
          description: Reason for flagging as duplicate
          example: "auto_creation_similarity"
        status:
          type: string
          enum: [pending, merged, dismissed]
          description: Current status of duplicate pair
          example: "pending"
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          description: Admin user who reviewed (null if pending)
          example: null
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: Review timestamp (null if pending)
          example: null
        createdAt:
          type: string
          format: date-time
          description: Detection timestamp
          example: "2025-12-09T10:30:00Z"

    DuplicateListResponse:
      type: object
      required:
        - duplicates
        - total
      properties:
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/PotentialDuplicate'
        total:
          type: integer
          description: Total count of duplicates matching filter
          example: 42

    MergeDuplicateRequest:
      type: object
      required:
        - keepProductId
        - archiveProductId
      properties:
        keepProductId:
          type: string
          format: uuid
          description: Product ID to keep (must be product_id_1 or product_id_2 from duplicate record)
          example: "a3f2b91c-4d5e-6f7a-8b9c-0d1e2f3a4b5c"
        archiveProductId:
          type: string
          format: uuid
          description: Product ID to archive (must be product_id_1 or product_id_2 from duplicate record)
          example: "b4e3c82d-5f6a-7e8b-9c0d-1e2f3a4b5c6d"

    MergeDuplicateResponse:
      type: object
      required:
        - success
        - mergedProduct
      properties:
        success:
          type: boolean
          description: Always true for successful merge
          example: true
        mergedProduct:
          type: object
          required:
            - id
            - name
            - supplierItemCount
          properties:
            id:
              type: string
              format: uuid
              description: ID of kept product
              example: "a3f2b91c-4d5e-6f7a-8b9c-0d1e2f3a4b5c"
            name:
              type: string
              description: Name of kept product
              example: "Battery 48V 20Ah Shtenli"
            supplierItemCount:
              type: integer
              description: Total supplier_items after merge (from both products)
              example: 5

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Always true for successful operation
          example: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code for client-side handling
              enum:
                - VALIDATION_ERROR
                - DUPLICATE_NOT_FOUND
                - MERGE_FAILED
                - INTERNAL_ERROR
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "keepProductId must be one of the products in the duplicate pair"
            details:
              type: object
              nullable: true
              description: Additional error details (optional)
              example:
                field: "keepProductId"
                providedValue: "invalid-uuid"

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Missing or invalid authentication token"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "An unexpected error occurred. Please try again later."
